<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 'wasm-unsafe-eval' (not the far broader 'unsafe-eval') is required for the Rapier physics
         and Manifold3D CSG WebAssembly modules to instantiate — it permits only WASM compilation. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockForge</title>
  </head>
  <body class="m-0 overflow-hidden bg-forge-950">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
